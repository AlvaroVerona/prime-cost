# Catalog of the synthetic wine bar "La Cepa" (Madrid): suppliers, ingredients, dishes and wines.
# Everything the generator and the analytics treat as "master data" lives here.
#
# Ingredient fields: unit, cost (EUR per unit, base price at the start of the period), shelf (days before it
# expires), trim (fraction lost when preparing: bones, peel, cutting), supplier, kind (fresh|dry|drink).
# Recipe quantities are per serving, in the ingredient's unit, BEFORE trim.

suppliers:
  # order_days = weekdays when the order is placed (0=Mon, the closed day, is used for admin).
  # Delivery arrives lead_days later (moved to the next open day).
  S_FRESCO: {name: "Mercado fresco",        order_days: [0, 3], lead_days: 1, min_order_eur: 60}
  S_CHARC:  {name: "Charcuteria y quesos",   order_days: [0, 3], lead_days: 1, min_order_eur: 80}
  S_PESC:   {name: "Pescaderia",             order_days: [0, 1, 3, 5], lead_days: 1, min_order_eur: 60}
  S_CARNE:  {name: "Carniceria",             order_days: [0, 3], lead_days: 1, min_order_eur: 50}
  S_ECON:   {name: "Economato y despensa",   order_days: [0], lead_days: 1, min_order_eur: 100}
  S_PAN:    {name: "Panaderia",              order_days: [0, 1, 2, 3, 4, 5, 6], lead_days: 1, min_order_eur: 0}
  S_BEB:    {name: "Distribuidor bebidas",   order_days: [0, 3], lead_days: 1, min_order_eur: 120}
  S_VINO:   {name: "Distribuidor vinos",     order_days: [0], lead_days: 2, min_order_eur: 150}

