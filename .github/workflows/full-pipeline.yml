name: Full pipeline

# Regenerates everything from scratch (data, validation, analytics, optimizers, scenarios) and runs the tests.
# Slow, so manual and weekly rather than on every push.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: make all
